<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Count-Up Chess Clock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@500;600;700&display=swap">
<style>
:root{--bg:#e8ebf0;--surf:#fff;--tx:#161a20;--mut:#667080;--bd:#ccd2dc;--btn:#161a20;--btnt:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141a;--surf:#1b212b;--tx:#eef1f5;--mut:#93a0b2;--bd:#2c3542;--btn:#eef1f5;--btnt:#10141a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10141a;--surf:#1b212b;--tx:#eef1f5;--mut:#93a0b2;--bd:#2c3542;--btn:#eef1f5;--btnt:#10141a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:500 16px/1.4 "Noto Sans",system-ui,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none;overflow:hidden}
.view{height:100%;display:none;flex-direction:column}
.view.on{display:flex}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;min-height:52px;padding:0 20px;background:var(--surf);color:var(--tx);border:1.5px solid var(--bd)}
button:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
button.pri{background:var(--btn);color:var(--btnt);border-color:var(--btn);font-weight:600}
/* setup */
#setup{align-items:center;justify-content:center;gap:20px;padding:24px;text-align:center;overflow-y:auto}
h1{font:700 34px/1.1 "Noto Sans",system-ui,sans-serif;margin:0}
.sub{color:var(--mut);margin:8px 0 0}
.stepper{display:flex;align-items:center;gap:18px}
.stepper button{width:64px;height:64px;padding:0;font-size:32px;border-radius:50%}
.stepper output{font:700 80px/1 "Noto Sans",system-ui,sans-serif;min-width:80px;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;max-width:280px}
.dots i{width:18px;height:18px;border-radius:50%}
#go{width:min(320px,100%);min-height:64px;font-size:20px}
.seg{display:flex;border:1.5px solid var(--bd);border-radius:14px;overflow:hidden;background:var(--surf)}
.seg button{border:0;border-radius:0;min-height:48px;padding:0 14px;background:transparent;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btnt);font-weight:600}
#namesBtn{width:min(320px,100%)}
#sheet{position:fixed;inset:0;background:rgba(10,14,20,.6);display:none;align-items:flex-end;justify-content:center;z-index:6}
#sheet.on{display:flex}
.panel{background:var(--bg);width:min(480px,100%);max-height:88%;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;text-align:left}
.panel h2{margin:0 0 2px;font-size:22px}
#fields{display:grid;gap:10px}
.fld{display:flex;align-items:center;gap:8px;min-width:0}
.fld i{width:8px;height:48px;border-radius:4px;flex:none}
.fld input{flex:1;min-width:0;height:48px;border-radius:12px;border:1.5px solid var(--bd);background:var(--surf);color:var(--tx);padding:0 14px;font:inherit;font-size:16px;user-select:text;-webkit-user-select:text}
/* game */
#tiles{flex:1;min-height:0;display:grid;gap:10px;padding:12px 12px 8px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:18px;background:var(--surf);border:1.5px solid var(--bd);border-left:10px solid var(--c);overflow:hidden;transition:background .15s,color .15s,transform .15s}
.tile .nm{font-weight:600;color:var(--mut);max-width:100%;padding:0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .tm{font:700 min(clamp(26px,6vh,44px),8vw)/1.1 "Noto Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.tile .tn{font-size:14px;color:var(--mut)}
.tile.act{background:var(--c);border-color:var(--c);color:#fff;transform:scale(1.015);z-index:1}
.tile.act .nm,.tile.act .tn{color:rgba(255,255,255,.85)}
.tile.act .tm{font-size:min(clamp(36px,10vh,96px),10vw)}
.cols1 .tile .tm{font-size:min(clamp(36px,9vh,64px),12vw)}
.cols1 .tile.act .tm{font-size:min(clamp(48px,14vh,112px),20vw)}
.bar{display:flex;gap:10px;padding:4px 12px 12px}
.bar button{flex:1}
#pause{flex:2}
#ov{position:fixed;inset:0;background:rgba(10,14,20,.78);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:5;text-align:center}
#ov.on{display:flex}
#ov b{font:700 44px/1.1 "Noto Sans",system-ui,sans-serif}
#ov span{opacity:.85}
</style>
</head>
<body>
<section id="setup" class="view on">
  <div><h1>Count-up chess clock</h1><p class="sub">Time adds up for each player. Tap to pass the turn.</p></div>
  <div class="stepper">
    <button id="minus" aria-label="Fewer players">−</button>
    <output id="cnt" aria-live="polite">2</output>
    <button id="plus" aria-label="More players">+</button>
  </div>
  <div class="dots" id="dots"></div>
  <p class="sub" style="margin:0">Players</p>
  <div class="seg" role="group" aria-label="Turn direction">
    <button id="cw" aria-pressed="true">↻ Clockwise</button>
    <button id="ccw" aria-pressed="false">↺ Counterclockwise</button>
  </div>
  <button id="namesBtn">Player names</button>
  <button id="go" class="pri">Start game</button>
  <div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT">
    <div class="panel">
      <h2 id="sheetT">Player names</h2>
      <div id="fields"></div>
      <button id="done" class="pri">Done</button>
    </div>
  </div>
</section>

<section id="game" class="view">
  <div id="tiles"></div>
  <div class="bar">
    <button id="back">Previous turn</button>
    <button id="pause" class="pri">Pause</button>
    <button id="end">New game</button>
  </div>
  <div id="ov"><b>Paused</b><span>Tap anywhere to resume</span></div>
</section>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
var HUES=[212,8,142,34,280,176,330,58];
var col=function(i){return 'hsl('+HUES[i%8]+' 62% 40%)'};
var S=null,count=2,dir=1,names=[],timer=null,endArm=0;
try{var c=parseInt(localStorage.getItem('cc-players'),10);if(c>=2&&c<=8)count=c;if(localStorage.getItem('cc-dir')==='-1')dir=-1;var nn=JSON.parse(localStorage.getItem('cc-names')||'[]');if(Array.isArray(nn))names=nn.slice(0,8).map(function(s){return typeof s==='string'?s:''})}catch(e){}

function nm(i){return (names[i]||'').trim()||'Player '+(i+1)}
function fmt(ms){
  var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);s%=60;
  var p=function(n){return n<10?'0'+n:''+n};
  return h?h+':'+p(m)+':'+p(s):p(m)+':'+p(s);
}
function show(id){
  document.querySelectorAll('.view').forEach(function(v){v.classList.toggle('on',v.id===id)});
}
function drawSetup(){
  $('#cnt').textContent=count;
  $('#dots').innerHTML=Array.from({length:count},function(_,i){return '<i style="background:'+col(i)+'"></i>'}).join('');
  $('#minus').disabled=count<=2;$('#plus').disabled=count>=8;
  try{localStorage.setItem('cc-players',count);localStorage.setItem('cc-dir',dir)}catch(e){}
  $('#cw').setAttribute('aria-pressed',dir===1);$('#ccw').setAttribute('aria-pressed',dir===-1);
}
$('#minus').onclick=function(){if(count>2){count--;drawSetup()}};
$('#plus').onclick=function(){if(count<8){count++;drawSetup()}};

function start(){
  S={n:count,t:Array(count).fill(0),turns:Array(count).fill(0),a:0,dir:dir,run:true,last:performance.now()};
  S.turns[0]=1;
  var cols=S.n===2?1:2,rows=Math.ceil(S.n/cols);
  var T=$('#tiles');
  T.className='cols'+cols;
  T.style.gridTemplateColumns='repeat('+cols+',1fr)';
  T.style.gridTemplateRows='repeat('+rows+',1fr)';
  T.innerHTML='';
  for(var i=0;i<S.n;i++){
    var d=document.createElement('div');
    d.className='tile';d.style.setProperty('--c',col(i));
    d.innerHTML='<div class="nm"></div><div class="tm">00:00</div><div class="tn"></div>';
    d.querySelector('.nm').textContent=nm(i);
    var p=seat(i,S.n);d.style.gridRow=p[0];d.style.gridColumn=p[1];
    T.appendChild(d);
  }
  $('#ov').classList.remove('on');
  $('#pause').textContent='Pause';
  show('game');paint();
  clearInterval(timer);timer=setInterval(paint,100);
}
/* seat i sits on the screen edge in clockwise order: top row left to right, down the right side, back along the bottom, up the left side */
function seat(i,n){
  if(n===2)return [i+1,'1'];
  var rows=Math.ceil(n/2),odd=n%2===1,last=odd?rows-1:rows,seq=[[1,'1'],[1,'2']],r;
  for(r=2;r<=last;r++)seq.push([r,'2']);
  if(odd)seq.push([rows,'1 / -1']);
  for(r=last;r>=2;r--)seq.push([r,'1']);
  return seq[i];
}
function commit(){
  var now=performance.now();
  if(S.run)S.t[S.a]+=now-S.last;
  S.last=now;
}
function paint(){
  if(!S)return;
  var now=performance.now(),tiles=$('#tiles').children;
  for(var i=0;i<S.n;i++){
    var ms=S.t[i]+(S.run&&i===S.a?now-S.last:0);
    var el=tiles[i];
    el.classList.toggle('act',i===S.a);
    el.querySelector('.tm').textContent=fmt(ms);
    el.querySelector('.tn').textContent='Turns: '+S.turns[i];
  }
}
function move(dir){
  commit();
  var old=S.a;
  S.a=(S.a+dir*S.dir+S.n)%S.n;
  if(dir>0)S.turns[S.a]++;else S.turns[old]=Math.max(0,S.turns[old]-1);
  try{navigator.vibrate&&navigator.vibrate(dir>0?25:10)}catch(e){}
  paint();
}
function setRun(r){
  commit();S.run=r;S.last=performance.now();
  $('#ov').classList.toggle('on',!r);
  $('#pause').textContent=r?'Pause':'Resume';
  paint();
}
$('#tiles').addEventListener('click',function(){if(S&&S.run)move(1)});
$('#back').onclick=function(){if(S&&S.run)move(-1)};
$('#pause').onclick=function(){if(S)setRun(!S.run)};
$('#ov').onclick=function(){if(S&&!S.run)setRun(true)};
$('#end').onclick=function(){
  var b=$('#end');
  if(Date.now()<endArm){endArm=0;b.textContent='New game';clearInterval(timer);S=null;drawSetup();show('setup');return}
  endArm=Date.now()+2500;b.textContent='Tap to confirm';
  setTimeout(function(){if(Date.now()>=endArm){b.textContent='New game'}},2600);
};
$('#cw').onclick=function(){dir=1;drawSetup()};
$('#ccw').onclick=function(){dir=-1;drawSetup()};
function openSheet(){
  var F=$('#fields');F.innerHTML='';
  F.style.gridTemplateColumns='repeat('+(count===2?1:2)+',minmax(0,1fr))';
  for(var i=0;i<count;i++){
    var row=document.createElement('div');row.className='fld';
    var sw=document.createElement('i');sw.style.background=col(i);
    var inp=document.createElement('input');
    inp.maxLength=14;inp.placeholder='Player '+(i+1);inp.value=names[i]||'';
    inp.setAttribute('aria-label','Name for player '+(i+1));inp.dataset.i=i;
    var p=seat(i,count);row.style.gridRow=p[0];row.style.gridColumn=p[1];
    row.appendChild(sw);row.appendChild(inp);F.appendChild(row);
  }
  $('#sheet').classList.add('on');
}
$('#fields').addEventListener('input',function(e){
  names[+e.target.dataset.i]=e.target.value;
  try{localStorage.setItem('cc-names',JSON.stringify(names.map(function(s){return s||''})))}catch(x){}
});
$('#fields').addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  var n=e.target.closest('.fld').nextElementSibling;
  if(n)n.querySelector('input').focus();else $('#done').click();
});
$('#namesBtn').onclick=openSheet;
$('#done').onclick=function(){$('#sheet').classList.remove('on')};
$('#sheet').addEventListener('click',function(e){if(e.target===this)this.classList.remove('on')});
$('#go').onclick=start;
document.addEventListener('visibilitychange',paint);
drawSetup();
})();
</script>
</body>
</html>
